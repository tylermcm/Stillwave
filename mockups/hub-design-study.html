  </div>

        <div class="sw-body"><div class="sw-top-slot"></div><main class="sw-content"></main><div class="sw-player-slot"></div></div>
        <div class="sw-overlay-slot"></div>

    </section>
  </div>
</div>
<style>
#sw-design-study{--sw-bg:light-dark(#f1f5f3,#0b0f10);--sw-surface:light-dark(#ffffff,#12191c);--sw-raised:light-dark(#e7eeeb,#1a2528);--sw-text:light-dark(#142522,#e1e8e8);--sw-muted:light-dark(#4e655e,#a1b0ae);--sw-line:light-dark(#ccd9d3,#273638);--sw-accent:light-dark(#17654e,#8fd6c0);--sw-on-accent:light-dark(#ffffff,#08201a);--sw-soft:light-dark(#d8eee4,#1a3930);--sw-red:light-dark(#a72e3d,#f19099);--sw-radius:12px;--sw-gap:18px;--sw-space:22px;color:var(--sw-text);font-family:Segoe UI,Roboto,Arial,sans-serif}

  const defaults={device:'tv',screens:{watch:'home',daily:'home'},listen:'radio',sport:'All',city:'Denver',media:[],playing:false,nowTitle:'Night Signals',nowType:'Radio · Ambient & electronic',cast:'',dialog:null,drawer:false,watchTitle:'Denver vs Boston',scene:'mountain',audioPane:0,radius:12,density:'Comfortable'};
  let state={...defaults};
  const apps=[...root.querySelectorAll('.sw-app')];
  const features={sports:{name:'Sports Center',icon:'trophy',hint:'Scores & what to watch'},listen:{name:'Radio & Podcasts',icon:'radio',hint:'Find your next listen'},daily:{name:'Daily Dashboard',icon:'sun',hint:'A little perspective'},world:{name:'Live World',icon:'earth',hint:'Somewhere else, right now'},ambient:{name:'Ambient Mode',icon:'waves',hint:'Set a quieter scene'},local:{name:'Local Media',icon:'folder-open',hint:'From this device'}};
  function icon(name){return `<span class="sw-icon"><i data-lucide="${name}" aria-hidden="true"></i></span>`;}
  function button(label,action,primary=false,extra=''){return `<button type="button" class="sw-action ${primary?'sw-primary':''} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;}
  function safe(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function modules(){return state.device==='mobile'?['sports','listen','daily','local']:['sports','listen','world','daily','ambient'];}
  function sectionTitle(name,action,label='View all'){return `<div class="sw-section-heading"><h2>${name}</h2>${action?`<button type="button" class="sw-link cursor-interaction" data-action="${action}">${label}${icon('arrow-up-right')}</button>`:''}</div>`;}
  function tiles(){return `<div class="sw-feature-grid">${modules().map(key=>`<button type="button" class="sw-tile cursor-interaction" data-action="screen:${key}">${icon(features[key].icon)}<strong>${features[key].name}</strong><small>${features[key].hint}</small></button>`).join('')}</div>`;}
  function brief(){return `<div class="sw-brief"><button type="button" class="sw-story cursor-interaction" data-action="story:Your evening briefing"><h3>Your evening briefing</h3><small>News · 5 stories to catch up on</small></button><button type="button" class="sw-story cursor-interaction" data-action="game:Denver vs Boston"><h3>On the court tonight</h3><small>Basketball · Tip-off at 7:30 PM</small></button><button type="button" class="sw-story cursor-interaction" data-action="story:A closer look at our night sky"><h3>A closer look at our night sky</h3><small>Astronomy · Picture & story</small></button></div>`;}
  function weather(){return `<div class="sw-weather"><div class="sw-weather-line"><span>${safe(state.city)}</span>${icon('cloud-sun')}</div><div class="sw-weather-value">62°</div><p>Partly cloudy</p><small>High 66° · Low 43°</small><div><button type="button" class="sw-link cursor-interaction" data-action="city">Change city ${icon('chevron-down')}</button></div></div>`;}
  function home(layout){
    if(layout==='daily')return `<div class="sw-eyebrow">Wednesday, October 28</div><h1>Your day, at a glance.</h1><p class="sw-subtitle">A quick catch-up before you settle in.</p><div class="sw-day-grid" style="margin-top:18px">${weather()}${brief()}</div>${sectionTitle('Make yourself at home','screen:discover','Explore')}${tiles()}`;
    return `<div class="sw-hero"><div class="sw-stadium"></div><div class="sw-hero-copy"><div class="sw-live-label"><span class="sw-live-dot"></span>TONIGHT · BASKETBALL</div><h1>Two games.<br>One good evening.</h1><p class="sw-subtitle">Denver vs Boston at 7:30 PM. Make room for another game with Multiview.</p><div class="sw-actions">${button(icon('trophy')+' Game details','game:Denver vs Boston',true)}${button(icon('panels-top-left')+' Multiview','screen:multi')}</div></div></div>${sectionTitle('Discover','screen:discover','Explore all')}${tiles()}<div class="sw-row"><div class="sw-row-left">${icon('tv')}<div class="sw-row-copy">Your channels are ready<small>Jump straight back into the guide.</small></div></div><button type="button" class="sw-link cursor-interaction" data-action="screen:guide">Open guide ${icon('arrow-right')}</button></div>`;
  }
  function sports(){
    const football=state.sport==='Football';
    return `<h1>Sports Center</h1><p class="sw-subtitle">The scores, the schedule, and where to watch.</p><div class="sw-tabs" role="group" aria-label="Sport">${['All','Basketball','Football'].map(s=>`<button type="button" data-action="sport:${s}" aria-pressed="${state.sport===s}" class="cursor-interaction">${s}</button>`).join('')}</div><div class="sw-score-grid"><div class="sw-match"><div class="sw-match-foot"><span>${football?'FOOTBALL':'BASKETBALL'} · LIVE</span><span class="sw-status">${football?'3rd · 08:42':'4th · 02:18'}</span></div><div class="sw-team"><span>${football?'Denver':'New York'}</span><b>${football?'17':'102'}</b></div><div class="sw-team"><span>${football?'Seattle':'Chicago'}</span><b>${football?'14':'98'}</b></div><div class="sw-match-foot"><span>Available in your guide</span></div><div class="sw-actions">${button(icon('play')+' Watch','watch:'+ (football?'Denver vs Seattle':'New York vs Chicago'),true)}${button('Details','game:'+ (football?'Denver vs Seattle':'New York vs Chicago'))}</div></div><div class="sw-match"><div class="sw-match-foot"><span>BASKETBALL · TONIGHT</span><span>7:30 PM</span></div><div class="sw-team"><span>Denver</span><b>—</b></div><div class="sw-team"><span>Boston</span><b>—</b></div><div class="sw-match-foot"><span>Watch options from your guide</span></div><div class="sw-actions">${button('Game details','game:Denver vs Boston')}${button('Add to Multiview','screen:multi')}</div></div></div><div class="sw-row"><div class="sw-row-copy">Seattle vs Portland<small>Tomorrow · 8:00 PM · No matching channel in your guide</small></div>${button('Details','game:Seattle vs Portland')}</div>`;
  }
  function listen(){const podcast=state.listen==='podcasts',active=state.playing&&state.nowTitle===(podcast?'The Long Way Home':'Night Signals');return `<h1>Radio & Podcasts</h1><p class="sw-subtitle">Something worth listening to.</p><div class="sw-tabs" role="group" aria-label="Listen type"><button type="button" data-action="listen:radio" aria-pressed="${!podcast}" class="cursor-interaction">Radio</button><button type="button" data-action="listen:podcasts" aria-pressed="${podcast}" class="cursor-interaction">Podcasts</button></div><div class="sw-audio-feature"><div class="sw-art">${icon(podcast?'podcast':'audio-lines')}</div><div class="sw-row-copy"><div class="sw-eyebrow">${podcast?'CONTINUE EPISODE':'STATION SPOTLIGHT'}</div><h2>${podcast?'The Long Way Home':'Night Signals'}</h2><small>${podcast?'Episode 18 · A quieter kind of adventure':'Ambient & electronic · Live radio'}</small>${podcast?'<div class="sw-progress"><span></span></div><small>18 of 50 min</small>':''}</div>${button(icon(active?'pause':'play')+(active?' Pause':podcast?' Resume':' Listen'),'audio:'+ (podcast?'The Long Way Home':'Night Signals'),true)}</div>${sectionTitle(podcast?'Browse episodes':'Find your frequency')}<div class="sw-row"><div class="sw-row-left"><div class="sw-art">${icon(podcast?'headphones':'music-2')}</div><div class="sw-row-copy">${podcast?'The coast after dark':'Slow Sunday Jazz'}<small>${podcast?'The Long Way Home · Episode 17 · 42 min':'Jazz · Instrumental'}</small></div></div>${button(icon('play')+' Play','audio:'+ (podcast?'The coast after dark':'Slow Sunday Jazz'))}</div><div class="sw-row"><div class="sw-row-left"><div class="sw-art">${icon(podcast?'mic-2':'radio-tower')}</div><div class="sw-row-copy">${podcast?'Small things, big ideas':'City Frequencies'}<small>${podcast?'The Curious Hour · Episode 32 · 36 min':'Independent radio · Eclectic'}</small></div></div>${button(icon('play')+' Play','audio:'+ (podcast?'Small things, big ideas':'City Frequencies'))}</div>`;}
  function daily(){return `<h1>Daily Dashboard</h1><p class="sw-subtitle">Weather, a few headlines, and a wider view.</p><div class="sw-day-grid" style="margin-top:18px">${weather()}${brief()}</div>${sectionTitle('Tonight in sport','screen:sports','Sports Center')}<div class="sw-row"><div class="sw-row-copy">Denver vs Boston<small>Basketball · 7:30 PM · Available in your guide</small></div>${button('Details','game:Denver vs Boston')}</div>`;}
  function local(){return `<h1>Local Media</h1><p class="sw-subtitle">Videos and audio you choose from this device.</p>${state.media.length?`<div class="sw-section-heading"><h2>Recently opened</h2>${button(icon('plus')+' Open files','files')}</div>${state.media.map(name=>`<div class="sw-row"><div class="sw-row-left"><div class="sw-art">${icon(name.endsWith('.mp4')?'film':'audio-lines')}</div><div class="sw-row-copy">${safe(name)}<small>On this device · ${name.endsWith('.mp4')?'2:18':'8:42'}</small></div></div>${button(icon('play')+' Play',(name.endsWith('.mp4')?'watch:':'audio:')+name)}</div>`).join('')}`:`<div class="sw-empty">${icon('folder-open')}<h2>Your files, right here.</h2><p>Choose a video or audio file to start. Only the files you select appear here.</p><div class="sw-actions">${button(icon('folder-open')+' Choose files','files',true)}</div></div>`}<p class="sw-empty-note">Files stay on your device.</p>`;}
  function scenes(ambient){const sceneData=ambient?[['rain','Rain at the window','Rain audio · Optional'],['ocean','Ocean air','Waves · Optional'],['fire','By the fireplace','Fire sounds · Optional']]:[['mountain','Alpine valley','Mountain views'],['ocean','Harbour morning','Coastal camera'],['mountain','Wildlife lookout','Forest camera']];return `<h1>${ambient?'Ambient Mode':'Live World'}</h1><p class="sw-subtitle">${ambient?'Let the room slow down.':'A window into somewhere else.'}</p><div class="sw-scenes">${sceneData.map(([scene,name,hint])=>`<button type="button" class="sw-scene cursor-interaction" data-action="scene:${scene}:${name}"><div class="sw-landscape" data-scene="${scene}"></div><div class="sw-scene-copy"><h3>${name}</h3><small>${hint}</small></div></button>`).join('')}</div>`;}
  function guide(){return `<div class="sw-section-heading"><div><h1>Live TV</h1><p class="sw-subtitle">Your guide, with the same familiar controls.</p></div>${button(icon('panels-top-left')+' Multiview','screen:multi')}</div><div class="sw-guide"><div class="sw-guide-head"><span>Today</span><span>7:00 PM</span><span>7:30 PM</span></div>${[['101','World News','Evening report','Across the world'],['102','Sports One','Pre-game','Denver vs Boston'],['103','Documentary','Wild coast','Wild coast'],['104','Cinema','The Long Journey','The Long Journey']].map(([num,ch,a,b])=>`<div class="sw-guide-row"><span>${num}<br>${ch}</span><button type="button" class="sw-on cursor-interaction" data-action="watch:${a}">${a}</button><button type="button" class="cursor-interaction" data-action="watch:${b}">${b}</button></div>`).join('')}</div>`;}
  function dvr(){return `<h1>My DVR</h1><p class="sw-subtitle">Your recordings, ready when you are.</p><div class="sw-tabs" role="group" aria-label="Recording view"><button type="button" aria-pressed="true" class="cursor-interaction" data-action="screen:dvr">Recordings</button><button type="button" aria-pressed="false" class="cursor-interaction" data-action="scheduled">Scheduled</button></div><div class="sw-row"><div class="sw-row-left"><div class="sw-art">${icon('film')}</div><div class="sw-row-copy">Wild coast<small>Documentary · 45 min · Protected</small></div></div>${button('Resume','watch:Wild coast',true)}</div><div class="sw-row"><div class="sw-row-left"><div class="sw-art">${icon('film')}</div><div class="sw-row-copy">Evening report<small>World News · 30 min</small></div></div>${button('Play','watch:Evening report')}</div><div class="sw-section-heading"><h2>Storage</h2><span class="sw-subtitle">2.4 GB recordings · 5.2 GB free</span></div><p class="sw-subtitle">Automatic cleanup is off. Protected recordings are kept.</p>`;}
  function watching(layout){return `<div class="sw-watch"><div class="sw-landscape" data-scene="${state.scene}"></div><div class="sw-watch-meta"><span class="sw-live-label">${icon('play')} ${safe(state.watchTitle)}</span>${button(icon('arrow-left')+' Back','screen:'+ (state.returnScreens?.[layout]||'guide'))}</div><div class="sw-watch-center">${button(icon(state.playing?'pause':'play')+(state.playing?' Pause':' Play'),'toggle',true)}</div><div class="sw-watch-bottom"><div class="sw-watch-meta"><span>${safe(state.watchTitle)}</span><span class="sw-status">${state.watchTitle.includes('.mp4')?'ON DEVICE':'PREVIEW'}</span></div><div class="sw-actions">${button(icon('panels-top-left')+' Multiview','screen:multi')}${button(icon('cast')+' Cast','cast')}${button(icon('tv')+' Guide','screen:guide')}</div></div></div>`;}
  function multi(){return `<h1>Multiview</h1><p class="sw-subtitle">Two pictures. Choose the one you hear.</p><div class="sw-split">${['New York vs Chicago','Denver vs Seattle'].map((name,i)=>`<button type="button" class="sw-split-pane cursor-interaction" data-action="pane:${i}" aria-pressed="${state.audioPane===i}"><div class="sw-landscape" data-scene="${i?'ocean':'mountain'}"></div><span>${name}</span><small>${icon(state.audioPane===i?'volume-2':'volume-x')} ${state.audioPane===i?'Audio on':'Muted'}</small></button>`).join('')}</div><div class="sw-actions">${button(icon('maximize')+' Expand selected','watch:'+ (state.audioPane?'Denver vs Seattle':'New York vs Chicago'))}${button(icon('cast')+' Cast','cast')}${button('Back to sports','screen:sports')}</div>`;}
  function getMain(screen,layout){if(screen==='home')return home(layout);if(screen==='discover')return `<h1>Discover</h1><p class="sw-subtitle">A little more to watch, hear, and explore.</p><div style="margin-top:20px">${tiles()}</div>`;if(screen==='sports')return sports();if(screen==='listen')return listen();if(screen==='daily')return daily();if(screen==='local')return local();if(screen==='world')return scenes(false);if(screen==='ambient')return scenes(true);if(screen==='guide')return guide();if(screen==='dvr')return dvr();if(screen==='watch')return watching(layout);if(screen==='multi')return multi();return home(layout);}
  function nav(screen,mobile){const active=['home','guide','dvr'].includes(screen)?screen:'discover';const items=[['home','house','Home'],['guide','tv','Live TV'],['dvr','clapperboard','My DVR'],['discover','compass','Discover']];return `<nav class="${mobile?'sw-mobile-drawer':'sw-nav'}" aria-label="StillWave navigation"><div class="sw-brand"><img src="${brand}" alt="StillWave"><span>StillWave</span></div>${items.map(([key,ic,label])=>`<button type="button" class="cursor-interaction" data-action="screen:${key}" ${active===key?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}<button type="button" class="sw-settings cursor-interaction" data-action="settings">${icon('settings-2')}<span>Settings</span></button>${mobile?'<button type="button" class="cursor-interaction" data-action="close">Close navigation</button>':''}</nav>`;}
  function dialog(){
    if(state.drawer)return nav('',true);
    if(!state.dialog)return '';
    const heading=`<div class="sw-dialog-heading"><h2>${safe(state.dialog.title)}</h2><button type="button" class="sw-icon-button cursor-interaction" aria-label="Close dialog" data-action="close">${icon('x')}</button></div>`;
    let body='';
    if(state.dialog.type==='cast')body=`<p class="sw-subtitle">Choose a screen on your network.</p>${['Living room','Bedroom'].map(name=>`<button type="button" class="sw-row cursor-interaction" data-action="connect:${name}"><div class="sw-row-left">${icon('tv')}<div class="sw-row-copy">${name}<small>Fire TV · ${state.cast===name?'Connected':'Available'}</small></div></div>${icon(state.cast===name?'check':'chevron-right')}</button>`).join('')}${state.cast?button('Disconnect','disconnect'):''}<p class="sw-modal-label">Device examples · No live connection</p>`;
    if(state.dialog.type==='game')body=`<div class="sw-eyebrow">BASKETBALL · TONIGHT · 7:30 PM</div><h1>${safe(state.dialog.title)}</h1><p class="sw-subtitle">${state.dialog.title==='Seattle vs Portland'?'No matching channel in your guide.':'Sports One · Available in your guide'}</p><div class="sw-actions">${button(icon('play')+' Watch channel','watch:'+state.dialog.title,true,state.dialog.title==='Seattle vs Portland'?'disabled':'')}${button('Open Multiview','screen:multi')}</div>`;
    if(state.dialog.type==='files')body=`<p class="sw-subtitle">Choose a file from this device.</p>${['Morning walk.mp4','Voice note.m4a'].map(name=>`<button type="button" class="sw-row cursor-interaction" data-action="import:${name}"><div class="sw-row-left">${icon(name.endsWith('.mp4')?'film':'audio-lines')}<span>${name}</span></div>${icon('plus')}</button>`).join('')}<p class="sw-modal-label">Device picker preview · Sample files</p>`;
    if(state.dialog.type==='city')body=['Denver','Colorado Springs','Seattle'].map(name=>`<button type="button" class="sw-row cursor-interaction" data-action="city:${name}">${name}${icon(state.city===name?'check':'chevron-right')}</button>`).join('');
    if(state.dialog.type==='settings')body=`<p class="sw-subtitle">Choose what appears in Discover.</p>${modules().map(key=>`<div class="sw-row"><span>${features[key].name}</span><span class="sw-status">Shown</span></div>`).join('')}<p class="sw-modal-label">Guide size, startup and DVR controls stay in Preferences.</p>`;
    if(state.dialog.type==='story')body=`<div class="sw-eyebrow">DAILY DASHBOARD</div><p class="sw-subtitle">${state.dialog.title.includes('sky')?'A full-width image with a short explanation, a date and a source link.':'A readable article summary with its publisher, update time and a link to the original story.'}</p><div class="sw-actions">${button('Back to Daily Dashboard','screen:daily',true)}</div>`;
    if(state.dialog.type==='scheduled')body=`<div class="sw-row"><div class="sw-row-copy">Denver vs Boston<small>Tonight · 7:25–10:15 PM · Includes padding</small></div></div><p class="sw-subtitle">Scheduled recordings keep their existing controls in My DVR.</p>`;
    return `<section role="dialog" aria-modal="true" aria-label="${safe(state.dialog.title)}" class="sw-dialog">${heading}${body}</section>`;
  }
  function render(){
    const focused=document.activeElement?.closest?.("[data-action]"),focusLayout=focused?.closest(".sw-app")?.dataset.layout,focusAction=focused?.dataset.action;
    root.style.setProperty('--sw-radius',state.radius+'px');root.style.setProperty('--sw-space',state.density==='Compact'?'16px':'22px');
    root.querySelectorAll('[data-device-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.deviceChoice===state.device)));
    apps.forEach(app=>{
      const layout=app.dataset.layout;let screen=state.screens[layout]||'home';
      if(state.device==='mobile'&&['world','ambient'].includes(screen))screen='discover';if(state.device==='tv'&&screen==='local')screen='discover';
      app.dataset.device=state.device;
      app.querySelector('.sw-nav-slot').innerHTML=state.device==='tv'?nav(screen,false):`<button type="button" class="sw-handle cursor-interaction" aria-label="Open navigation" data-action="drawer">${icon('chevron-right')}</button>`;
      const screenName={home:'Home',guide:'Live TV',dvr:'My DVR',discover:'Discover',sports:'Sports Center',listen:'Radio & Podcasts',daily:'Daily Dashboard',local:'Local Media',world:'Live World',ambient:'Ambient Mode',watch:'Player',multi:'Multiview'}[screen];
      app.querySelector('.sw-top-slot').innerHTML=`<header class="sw-top"><div class="sw-breadcrumb">${icon(screen==='home'?'house':'compass')} ${screenName}</div><div class="sw-top-actions"><span class="sw-clock">Wednesday · 7:12 PM</span><button type="button" class="sw-icon-button ${state.cast?'sw-connected':''} cursor-interaction" aria-label="${state.cast?'Casting to '+state.cast:'Cast to a screen'}" data-action="cast">${icon('cast')}</button></div></header>`;
      app.querySelector('.sw-content').innerHTML=getMain(screen,layout);
      app.querySelector('.sw-player-slot').innerHTML=['watch','multi'].includes(screen)?'':`<div class="sw-now-playing"><div class="sw-cover">${icon('audio-lines')}</div><div class="sw-player-copy">${safe(state.nowTitle)}<small>${state.cast?'Playing on '+state.cast:state.nowType}</small></div><div class="sw-mini-controls"><button type="button" class="sw-icon-button cursor-interaction" aria-label="${state.playing?'Pause audio':'Play audio'}" data-action="toggle">${icon(state.playing?'pause':'play')}</button><button type="button" class="sw-icon-button cursor-interaction" aria-label="Open radio and podcasts" data-action="screen:listen">${icon('chevron-up')}</button></div></div>`;
      app.querySelector('.sw-overlay-slot').innerHTML=dialog();
    });
    if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
    if(focusLayout){const activeApp=apps.find(a=>a.dataset.layout===focusLayout);const scope=(state.dialog||state.drawer)?activeApp.querySelector('.sw-overlay-slot'):activeApp;const candidates=[...scope.querySelectorAll('[data-action]')];const next=candidates.find(b=>b.dataset.action===focusAction)||candidates[0];next?.focus({preventScroll:true});}
  }
  function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{device:state.device,screens:state.screens,homeDirections:['Watch first','Daily first']},privateContent:{listen:state.listen,sport:state.sport,city:state.city,media:state.media,radius:state.radius,density:state.density,drawer:state.drawer,dialog:state.dialog,playing:state.playing,cast:state.cast,watchTitle:state.watchTitle,returnScreens:state.returnScreens,scene:state.scene,audioPane:state.audioPane,nowTitle:state.nowTitle,nowType:state.nowType}}).catch(()=>{});}
  function restore(saved){if(!saved)return;const model=saved.modelContent||{},priv=saved.privateContent||{};Object.assign(state,priv,model,{screens:{...defaults.screens,...model.screens}});if(!['tv','mobile'].includes(state.device))state.device='tv';}
  restore(window.openai?.widgetState);render();
  root.addEventListener('click',event=>{
    if(event.target.classList.contains('sw-overlay-slot')){state.drawer=false;state.dialog=null;render();persist();return;}
    const device=event.target.closest('[data-device-choice]');if(device){state.device=device.dataset.deviceChoice;state.drawer=false;state.dialog=null;render();persist();return;}
    const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
    const app=target.closest('.sw-app'),layout=app?.dataset.layout||'watch',value=target.dataset.action,[action,...parts]=value.split(':'),detail=parts.join(':');
    if(action==='screen'){state.screens[layout]=detail;state.drawer=false;state.dialog=null;}
    if(action==='drawer'){state.drawer=true;state.dialog=null;}
    if(action==='close'){state.drawer=false;state.dialog=null;}
    if(action==='cast'){state.dialog={type:'cast',title:'Cast to a screen'};state.drawer=false;}
    if(action==='connect'){state.cast=detail;state.dialog=null;}
    if(action==='disconnect'){state.cast='';state.dialog=null;}
    if(action==='sport')state.sport=detail;
    if(action==='listen')state.listen=detail;
    if(action==='toggle')state.playing=!state.playing;
    if(action==='audio'){if(state.nowTitle===detail)state.playing=!state.playing;else state.playing=true;state.nowTitle=detail;state.nowType=detail.endsWith('.m4a')?'Local audio · On this device':state.listen==='podcasts'?'Podcast · Episode playback':'Radio · Live station';}
    if(action==='watch'){state.returnScreens={...state.returnScreens,[layout]:state.screens[layout]==='watch'?(state.returnScreens?.[layout]||'guide'):state.screens[layout]};state.watchTitle=detail;state.playing=true;state.screens[layout]='watch';state.dialog=null;state.drawer=false;}
    if(action==='scene'){state.returnScreens={...state.returnScreens,[layout]:state.screens[layout]};state.scene=parts[0];state.watchTitle=parts.slice(1).join(':');state.playing=false;state.screens[layout]='watch';}
    if(action==='game')state.dialog={type:'game',title:detail};
    if(action==='files')state.dialog={type:'files',title:'Open from this device'};
    if(action==='import'){state.media=[detail,...state.media.filter(x=>x!==detail)];state.dialog=null;}
    if(action==='city'){if(detail){state.city=detail;state.dialog=null;}else state.dialog={type:'city',title:'Your city'};}
    if(action==='story')state.dialog={type:'story',title:detail};
    if(action==='settings'){state.drawer=false;state.dialog={type:'settings',title:'Your Discover'};}
    if(action==='scheduled')state.dialog={type:'scheduled',title:'Scheduled recordings'};
    if(action==='pane')state.audioPane=Number(detail);
    render();persist();
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'){if(state.dialog||state.drawer){state.dialog=null;state.drawer=false;render();}else{const app=event.target.closest('.sw-app');if(app){state.screens[app.dataset.layout]='home';render();}}return;}
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
    const app=event.target.closest('.sw-app');if(!app||state.device!=='tv')return;
    const scope=(state.dialog||state.drawer)?app.querySelector('.sw-overlay-slot'):app;
    const candidates=[...scope.querySelectorAll('button:not(:disabled)')].filter(el=>el.getClientRects().length);
    const current=event.target.closest('button');if(!current)return;
    const rect=current.getBoundingClientRect(),cx=rect.x+rect.width/2,cy=rect.y+rect.height/2;
    const horizontal=event.key==='ArrowLeft'||event.key==='ArrowRight',positive=event.key==='ArrowRight'||event.key==='ArrowDown';
    const match=candidates.filter(el=>el!==current).map(el=>{const b=el.getBoundingClientRect(),dx=b.x+b.width/2-cx,dy=b.y+b.height/2-cy;return{el,along:horizontal?dx:dy,across:horizontal?dy:dx};}).filter(x=>positive?x.along>2:x.along< -2).sort((a,b)=>(Math.abs(a.along)+Math.abs(a.across)*2.5)-(Math.abs(b.along)+Math.abs(b.across)*2.5))[0];
    if(match){event.preventDefault();match.el.focus();}
  });
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSlider(state,'radius',{label:'Corner radius',min:0,max:22,unit:'px'});tweak.addSelect(state,'density',{label:'Spacing',options:['Comfortable','Compact']});}
})();
</script>
