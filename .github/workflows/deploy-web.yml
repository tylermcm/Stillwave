name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Shared with refresh-epg.yml: both publish the one Pages site.
  group: pages-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: web
        uses: ./.github/actions/build-web
        with:
          base-url: /${{ github.event.repository.name }}
      # A deployment replaces the whole site, so carry over the live guide files
      # (refreshed by refresh-epg.yml) instead of removing them.
      - name: Keep published guide
        env:
          SITE: ${{ steps.web.outputs.path }}
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for f in stillwave-us.xml.gz stillwave-us.xml manifest.json status.json guide.html; do
            curl -fsSL "$base/$f" -o "$SITE/$f" || echo "No published $f yet"
          done
      # Pages has no SPA fallback; serve the app for unknown paths too.
      - run: cp "${{ steps.web.outputs.path }}/index.html" "${{ steps.web.outputs.path }}/404.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.web.outputs.path }}
      - id: deployment
        uses: actions/deploy-pages@v4
