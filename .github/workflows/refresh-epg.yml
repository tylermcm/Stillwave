name: Refresh hosted EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-epg.yml'
      - 'services/epg/**'
      - 'scripts/*guide*.ts'
      - 'src/core/guide*.ts'
      - 'src/core/xmltv.ts'
      - 'src/core/providerGuides.ts'
      - 'src/core/tvPassportGuide.ts'
      - 'src/core/tvDefaults.ts'
      - 'src/data/guideStationAliases.json'

permissions:
  contents: read

concurrency:
  group: hosted-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Stage standalone collector
        run: node services/epg/stage.mjs
      - name: Install locked collector dependencies
        working-directory: .build-tmp/epg-service
        run: npm ci --ignore-scripts
      - name: Build and verify fresh guide
        working-directory: .build-tmp/epg-service
        run: npm run build
      - name: Prepare public status page
        run: node services/epg/prepare-public.mjs
      - name: Upload verified guide
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build-tmp/epg-service/artifacts/epg
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
