<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>StillWave</title>
    <meta name="theme-color" content="#0b0f10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StillWave" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0b0f10;
      }
      body {
        overflow: hidden;
      }
      /* The guide only lays out correctly in landscape (as on Android). Touch
         devices held upright get a prompt instead of a broken guide. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0b0f10;
        color: #e7f4ef;
        font: 20px system-ui, sans-serif;
        text-align: center;
      }
      #rotate svg { width: 72px; height: 72px; animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a7eccb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      <div>Rotate your device to landscape<br /><span style="color:#7e9690;font-size:16px">StillWave's guide is built for a wide screen.</span></div>
    </div>
    <script>
      // Honoured in installed/fullscreen apps on Android; iOS and plain tabs
      // rely on the overlay above. Chrome only allows the lock while fullscreen.
      function lockLandscape() {
        try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
      }
      lockLandscape();

      // Browser chrome (the address bar) stays visible unless the page asks for
      // fullscreen. On touch devices, go fullscreen while a channel is playing
      // and leave when it closes. Needs a tap, so it fires on the next tap if a
      // stream starts too late for the tap that opened it.
      (function () {
        var root = document.documentElement;
        if (!matchMedia('(pointer: coarse)').matches) return;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!request) return;
        var active = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
        var playing = function () { return !!document.querySelector('video'); };
        function enter() {
          if (active() || !playing()) return;
          try {
            var result = request.call(root, { navigationUI: 'hide' });
            if (result && result.then) result.then(lockLandscape, function () {});
          } catch (e) {}
        }
        document.addEventListener('playing', enter, true);
        document.addEventListener('pointerup', enter, true);
        var timer;
        new MutationObserver(function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            if (!active() || playing()) return;
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          }, 400);
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
